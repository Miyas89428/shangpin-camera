<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>尚品精修相機工作室｜維修客戶管理</title>
<style>
:root{font-family:system-ui,'Noto Sans TC',sans-serif;color:#17263d;background:#f3f6fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 15px;background:#173d67;color:white}button.secondary{background:#e7edf4;color:#19334e}button.danger{background:#9b3344}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;padding:9px;border:1px solid #c9d4e0;border-radius:8px;background:white}textarea{min-height:75px}label{display:block;font-size:.86rem;font-weight:600;margin-bottom:5px}.hidden{display:none!important}.login{max-width:440px;margin:9vh auto;background:white;padding:32px;border-radius:18px;box-shadow:0 12px 45px #18375416}.login h1{margin:0 0 8px}.muted{color:#607188}.field{margin-bottom:15px}.layout{display:grid;grid-template-columns:minmax(210px,1fr) minmax(0,2fr);min-height:100vh}aside{background:#112f50;color:white;padding:24px 18px}aside h2{font-size:1.2rem}aside button{width:100%;text-align:left;margin:5px 0;background:transparent;border:1px solid #ffffff35}aside button.active{background:#286094}main{padding:24px;min-width:0}.panel{background:white;border:1px solid #e0e7f0;border-radius:14px;padding:22px;margin-bottom:16px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:15px}.toolbar input{flex:1;min-width:180px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.full{grid-column:1/-1}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{padding:10px;border-bottom:1px solid #e3e8ef;text-align:left}th{background:#f4f7fb}td button{padding:6px 10px}.scroll{overflow:auto}.notice{padding:12px;background:#fff7e7;border:1px solid #f4d39d;border-radius:10px;margin:12px 0}.ok{color:#18734b}.error{color:#b12639;white-space:pre-wrap}.small{font-size:.82rem}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{background:#e6eef8;border-radius:99px;padding:5px 10px;font-size:.82rem}.stat{display:inline-block;padding:8px 12px;background:#eef4fa;border-radius:10px;margin:3px}.field[aria-disabled=true] input,.field[aria-disabled=true] select,.field[aria-disabled=true] textarea{background:#f0f3f7}.dangertext{color:#a53042}@media(max-width:780px){.layout{grid-template-columns:1fr}aside{padding:14px}main{padding:12px}.grid{grid-template-columns:1fr}.login{margin:20px 12px}.top{align-items:flex-start;flex-direction:column}}
</style></head><body>
<section id="login" class="login"><h1>📷 尚品精修相機工作室</h1><p class="muted">維修客戶雲端管理系統｜Spark 免費方案</p><div class="notice small">為保護客戶個資，正式版採 Firebase 電子郵件＋密碼驗證；員工編號用於員工識別，不作為單獨登入憑證。</div><form id="loginForm"><div class="field"><label>員工登入電子郵件</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>密碼</label><input id="password" type="password" required autocomplete="current-password"></div><button type="submit">安全登入</button></form><p id="loginMsg" class="error" role="alert"></p></section>
<div id="app" class="layout hidden"><aside><h2>📷 尚品精修相機工作室</h2><p id="identity" class="small"></p><button data-view="new" class="active">＋ 新增客戶資料</button><button data-view="list">▤ 客戶資料庫</button><button data-view="staff" id="staffNav">♙ 員工權限設定</button><button data-view="audit" id="auditNav">◷ 異動紀錄</button><button data-view="export">⇩ Excel 資料匯出</button><button id="logout" class="secondary">登出</button></aside><main><div class="top"><h2 id="viewTitle">新增客戶資料</h2><span id="status" class="pill">準備就緒</span></div><div id="view"></div></main></div>
<script type="module">
// ★ 必填：將 Firebase Console → 專案設定 → 網頁應用程式 的 firebaseConfig 貼在此處
const firebaseConfig = {
  apiKey: 'AIzaSyDiD3uWPT6u0n8yB41JP5Gmxc67RoU4f5c',
  authDomain: 'shangpin-camera.firebaseapp.com',
  projectId: 'shangpin-camera',
  storageBucket: 'shangpin-camera.firebasestorage.app',
  messagingSenderId: '1098227233431',
  appId: '1:1098227233431:web:6eef5aa5adb4fad565afd2',
  measurementId: 'G-2RRVL75NEQ'
};
import {initializeApp} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js';
import {getFirestore,doc,getDoc,collection,query,orderBy,limit,getDocs,startAfter,writeBatch,serverTimestamp,setDoc} from 'https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js';
const $=id=>document.getElementById(id); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fields=[['receivedDate','收件日期','date'],['invoice','單據編號','text'],['customerName','客戶姓名','text'],['englishName','客戶英文名','text'],['phone','客戶電話','tel'],['socialChannel','社群聯絡方式','select','LINE|Facebook|Instagram|WeChat|WhatsApp|其他|無'],['socialId','社群ID','text'],['brand','廠牌','text'],['model','型號','text'],['lensSpec','鏡頭規格','text'],['bodySerial','機身號碼','text'],['lensSerial','鏡頭號碼','text'],['accessories','配件','textarea'],['estimatedIssue','預估故障問題','textarea'],['estimateAmount','估價金額','number'],['expectedDate','預計交件日','date'],['actualIssue','實際故障問題','textarea'],['receivedAmount','實收金額','number'],['paymentMethod','收款方式','select','未收款|現金|轉帳|刷卡|行動支付|其他'],['notifyDate','通知取/寄貨日期','date'],['shippingAddress','寄件地址','textarea'],['dispatchDate','寄出/取件日期','date'],['trackingNumber','寄件追蹤單號','text'],['notes','備註說明','textarea']];
const technician=new Set(['estimatedIssue','estimateAmount','expectedDate','actualIssue','notes']);
const frontdesk=new Set(['receivedDate','invoice','customerName','englishName','phone','socialChannel','socialId','brand','model','lensSpec','bodySerial','lensSerial','accessories','receivedAmount','paymentMethod','notifyDate','shippingAddress','dispatchDate','trackingNumber','notes']);
const allowed=()=>profile.role==='老闆'?new Set(fields.map(f=>f[0])):profile.role==='師傅'?technician:frontdesk;
let auth,db,profile=null,user=null,records=[],currentView='new',currentId=null,cacheStaff=[];
const setStatus=(s,bad=false)=>{ $('status').textContent=s;$('status').style.color=bad?'#a53042':'#19334e';};
const msg=(s)=>`<div class="notice">${esc(s)}</div>`;
function initialize(){if(Object.values(firebaseConfig).some(x=>String(x).includes('REPLACE_ME'))){$('loginMsg').textContent='尚未填入 firebaseConfig。請先依 README 完成 Firebase 專案設定。';return;}try{const app=initializeApp(firebaseConfig);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,async u=>{user=u;profile=null;if(!u){$('login').classList.remove('hidden');$('app').classList.add('hidden');return;}try{const snap=await getDoc(doc(db,'employees',u.uid));if(!snap.exists()||snap.data().active!==true||!['老闆','師傅','櫃台'].includes(snap.data().role))throw Error('此帳號尚未授權或已停用，請洽老闆。');profile=snap.data();$('identity').textContent=`${profile.code}｜${profile.role}｜${profile.name||''}`;$('staffNav').classList.toggle('hidden',profile.role!=='老闆');$('auditNav').classList.toggle('hidden',profile.role!=='老闆');$('login').classList.add('hidden');$('app').classList.remove('hidden');await show('list');}catch(e){$('loginMsg').textContent=e.message;await signOut(auth);}});}catch(e){$('loginMsg').textContent=e.message;}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginMsg').textContent='';try{if(!auth)throw Error('請先設定 Firebase。');await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);}catch(e){$('loginMsg').textContent='登入失敗：請檢查帳號、密碼或 Firebase 設定。';}});
$('logout').onclick=()=>signOut(auth);document.querySelectorAll('aside [data-view]').forEach(b=>b.onclick=()=>show(b.dataset.view));
function canEdit(k,newCase){return profile.role==='老闆'||(newCase?profile.role==='櫃台'&&frontdesk.has(k):allowed().has(k));}
function renderForm(data={},newCase=true){const html=fields.map(([key,label,type,options])=>{const enabled=canEdit(key,newCase),required=['invoice','customerName','receivedDate'].includes(key),val=data[key]??'';let control;if(type==='textarea')control=`<textarea name="${key}" ${enabled?'':'disabled'}>${esc(val)}</textarea>`;else if(type==='select')control=`<select name="${key}" ${enabled?'':'disabled'}><option value="">請選擇</option>${options.split('|').map(o=>`<option value="${esc(o)}" ${val===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;else control=`<input name="${key}" type="${type}" ${type==='number'?'min="0" step="1"':''} value="${esc(val)}" ${enabled?'':'disabled'} ${required&&enabled?'required':''} ${key==='invoice'&&!newCase?'readonly':''}>`;return `<div class="field ${type==='textarea'?'full':''}" aria-disabled="${!enabled}"><label>${esc(label)}${required?' *':''}</label>${control}</div>`;}).join('');$('view').innerHTML=`<section class="panel"><p class="muted">${newCase?'建立新維修案件':'案件編號：'+esc(currentId)}｜僅有權限的欄位可編輯</p><form id="caseForm"><div class="field"><label>客戶分類 *</label><select name="category" ${profile.role==='師傅'?'disabled':''}><option value="">請選擇</option>${['國內散客戶','國內合作戶','國外客戶'].map(x=>`<option ${data.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="grid">${html}</div><div class="toolbar"><button type="submit">${newCase?'新增並儲存':'儲存修改'}</button><button type="button" class="secondary" id="backList">返回資料庫</button></div></form><p id="formMessage" role="alert"></p></section>`;$('caseForm').onsubmit=e=>saveCase(e,newCase,data);$('backList').onclick=()=>show('list');}
async function saveCase(e,newCase,original){e.preventDefault();const fm=$('formMessage');fm.textContent='儲存中…';try{if(newCase&&profile.role==='師傅')throw Error('師傅不能新增案件。');const fd=new FormData(e.target),updates={};for(const [key,,type] of fields){if(!canEdit(key,newCase))continue;const raw=String(fd.get(key)??'').trim();updates[key]=type==='number'?(raw===''?null:Number(raw)):raw;}if(profile.role!=='師傅')updates.category=String(fd.get('category')??'');if(newCase){if(!updates.invoice||!updates.customerName||!updates.receivedDate||!updates.category)throw Error('請填寫單據編號、客戶姓名、收件日期、客戶分類。');if(!/^[A-Za-z0-9_-]{1,80}$/.test(updates.invoice))throw Error('單據編號只能使用英數、底線、連字號，最多80字。');}const id=newCase?updates.invoice:currentId;const ref=doc(db,'cases',id);if(newCase){const exists=await getDoc(ref);if(exists.exists())throw Error('單據編號已存在，請使用其他編號。');}const batch=writeBatch(db);const payload=newCase?{...Object.fromEntries(fields.map(f=>[f[0],f[2]==='number'?null:''])),...updates,createdAt:serverTimestamp(),createdBy:user.uid,updatedAt:serverTimestamp(),updatedBy:user.uid}:{...updates,updatedAt:serverTimestamp(),updatedBy:user.uid};batch.set(ref,payload,{merge:!newCase});const logRef=doc(collection(db,'auditLogs'));batch.set(logRef,{caseId:id,actorUid:user.uid,actorCode:profile.code,action:newCase?'create':'update',changedFields:Object.keys(updates),at:serverTimestamp()});await batch.commit();fm.className='ok';fm.textContent='已儲存至 Firestore。';setStatus('儲存成功');if(newCase){currentId=id;setTimeout(()=>show('list'),450);}}catch(err){fm.className='error';fm.textContent='儲存失敗：'+err.message;setStatus('儲存失敗',true);}}
async function loadCases(){setStatus('讀取中…');const s=await getDocs(query(collection(db,'cases'),orderBy('receivedDate','desc'),limit(500)));records=s.docs.map(d=>({id:d.id,...d.data()}));setStatus(`已載入 ${records.length} 筆${records.length===500?'（僅最新500筆）':''}`);}
function renderList(){const canNew=profile.role!=='師傅';$('view').innerHTML=`<section class="panel"><div class="toolbar"><input id="search" placeholder="搜尋單號、姓名、電話、廠牌、型號"><select id="categoryFilter" style="max-width:180px"><option value="">全部客戶類別</option><option>國內散客戶</option><option>國內合作戶</option><option>國外客戶</option></select><button id="refresh">重新整理</button>${canNew?'<button id="add">新增案件</button>':''}</div><div id="stats"></div><div class="scroll"><table><thead><tr><th>收件日期</th><th>單據編號</th><th>客戶姓名</th><th>分類</th><th>廠牌／型號</th><th>預計交件日</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><p class="small muted">列表僅顯示最新 500 筆；完整匯出會逐頁讀取全部案件。大量資料應增加伺服器端搜尋與分頁。</p></section>`;const refreshRows=()=>{const q=$('search').value.trim().toLowerCase(),cat=$('categoryFilter').value;const r=records.filter(x=>(!cat||x.category===cat)&&[x.id,x.customerName,x.phone,x.brand,x.model].some(v=>String(v??'').toLowerCase().includes(q)));$('stats').innerHTML=`<span class="stat">目前篩選 ${r.length} 筆</span>`;$('rows').innerHTML=r.map(x=>`<tr><td>${esc(x.receivedDate)}</td><td>${esc(x.id)}</td><td>${esc(x.customerName)}</td><td>${esc(x.category)}</td><td>${esc(x.brand)} ${esc(x.model)}</td><td>${esc(x.expectedDate)}</td><td><button data-id="${esc(x.id)}">查看／編輯</button></td></tr>`).join('')||'<tr><td colspan="7">沒有符合條件的案件</td></tr>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>openCase(b.dataset.id));};$('search').oninput=refreshRows;$('categoryFilter').onchange=refreshRows;$('refresh').onclick=()=>show('list');if(canNew)$('add').onclick=()=>show('new');refreshRows();}
async function openCase(id){try{const snap=await getDoc(doc(db,'cases',id));if(!snap.exists())throw Error('案件不存在');currentId=id;currentView='edit';$('viewTitle').textContent='檢視／編輯客戶資料';renderForm(snap.data(),false);}catch(e){setStatus(e.message,true);}}
async function show(view){if(!profile)return;currentView=view;document.querySelectorAll('aside [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const names={new:'新增客戶資料',list:'客戶資料庫',staff:'員工權限設定',audit:'異動紀錄',export:'Excel 資料匯出'};$('viewTitle').textContent=names[view]||view;try{if(view==='new'){if(profile.role==='師傅'){await show('list');return;}currentId=null;renderForm({},true);}else if(view==='list'){await loadCases();renderList();}else if(view==='staff')await showStaff();else if(view==='audit')await showAudit();else if(view==='export')showExport();}catch(e){$('view').innerHTML=msg('操作失敗：'+e.message);setStatus('讀取失敗',true);}}
async function showStaff(){if(profile.role!=='老闆')throw Error('無權限');const snap=await getDocs(collection(db,'employees'));cacheStaff=snap.docs.map(x=>({uid:x.id,...x.data()}));$('view').innerHTML=`<section class="panel"><h3>員工權限管理</h3><div class="notice small">Spark 免費版無可信任後端可安全建立 Authentication 帳號。請先由老闆到 Firebase Console → Authentication 手動建立帳號，再把其 UID 貼在下方。此頁只建立／更新員工權限文件。不要在網頁儲存員工密碼。</div><form id="staffForm" class="grid"><div class="field"><label>Authentication UID</label><input name="uid" required placeholder="貼上 Firebase UID"></div><div class="field"><label>員工編號</label><input name="code" required placeholder="SP_001"></div><div class="field"><label>員工姓名</label><input name="name" required></div><div class="field"><label>角色</label><select name="role"><option>師傅</option><option>櫃台</option></select></div><div class="field"><label>帳號狀態</label><select name="active"><option value="true">啟用</option><option value="false">停用</option></select></div><div class="full"><button>儲存員工設定</button></div></form><p id="staffMsg"></p><div class="scroll"><table><thead><tr><th>員工編號</th><th>姓名</th><th>角色</th><th>狀態</th><th>UID</th></tr></thead><tbody>${cacheStaff.map(s=>`<tr><td>${esc(s.code)}</td><td>${esc(s.name)}</td><td>${esc(s.role)}</td><td>${s.active?'啟用':'停用'}</td><td class="small">${esc(s.uid)}</td></tr>`).join('')}</tbody></table></div></section>`;$('staffForm').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const uid=String(fd.get('uid')).trim(),code=String(fd.get('code')).trim().toUpperCase();if(!/^[A-Za-z0-9_-]{4,40}$/.test(code))throw Error('員工編號需為4至40位英數、底線或連字號');if(cacheStaff.some(s=>s.code===code&&s.uid!==uid))throw Error('員工編號重複');await setDoc(doc(db,'employees',uid),{code,name:String(fd.get('name')).trim(),role:String(fd.get('role')),active:fd.get('active')==='true'},{merge:true});$('staffMsg').textContent='已儲存員工權限；請確認 Authentication 帳號已建立。';await showStaff();}catch(err){$('staffMsg').textContent='失敗：'+err.message;}};}
async function showAudit(){if(profile.role!=='老闆')throw Error('無權限');const s=await getDocs(query(collection(db,'auditLogs'),orderBy('at','desc'),limit(300)));$('view').innerHTML=`<section class="panel"><div class="notice small">這是前端配合批次寫入的操作紀錄，無法證明所有操作均有紀錄，也不能防止具有 Firebase Console 管理權限者修改。僅供營運追蹤，不是不可竄改的法規稽核日誌。</div><div class="scroll"><table><thead><tr><th>時間</th><th>單號</th><th>操作人</th><th>動作</th><th>欄位</th></tr></thead><tbody>${s.docs.map(d=>{const a=d.data();return `<tr><td>${esc(a.at?.toDate?.().toLocaleString('zh-TW')||'')}</td><td>${esc(a.caseId)}</td><td>${esc(a.actorCode)}</td><td>${esc(a.action)}</td><td>${esc((a.changedFields||[]).join(', '))}</td></tr>`;}).join('')}</tbody></table></div><p class="small muted">僅顯示最近300筆。</p></section>`;}
function showExport(){$('view').innerHTML=`<section class="panel"><h3>匯出全部維修案件</h3><p>會分頁讀取全部案件並產生 .xlsx；檔案包含客戶個資，請妥善保存。匯出需連線載入 SheetJS 函式庫。</p><button id="exportBtn">下載全部案件 Excel</button><p id="exportMsg"></p></section>`;$('exportBtn').onclick=exportXlsx;}
async function exportXlsx(){const el=$('exportMsg');el.textContent='讀取全部案件中…';try{if(!window.XLSX){await new Promise((resolve,reject)=>{const script=document.createElement('script');script.src='https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';script.onload=resolve;script.onerror=()=>reject(Error('無法載入 Excel 匯出元件，請檢查網路或 CDN。'));document.head.appendChild(script);});}const all=[];let cursor=null;do{const constraints=[orderBy('receivedDate','desc'),limit(400)];if(cursor)constraints.push(startAfter(cursor));const snap=await getDocs(query(collection(db,'cases'),...constraints));snap.forEach(d=>all.push(d.data()));cursor=snap.size===400?snap.docs[snap.docs.length-1]:null;el.textContent=`已讀取 ${all.length} 筆…`;}while(cursor);const rows=all.map(r=>Object.fromEntries([['category','客戶分類'],...fields.map(([k,l])=>[k,l])].map(([k,l])=>[l,r[k]??''])));const sheet=window.XLSX.utils.json_to_sheet(rows.length?rows:[{'提示':'目前沒有案件'}]);const book=window.XLSX.utils.book_new();window.XLSX.utils.book_append_sheet(book,sheet,'維修案件');window.XLSX.writeFile(book,`尚品維修資料_${new Date().toISOString().slice(0,10)}.xlsx`);el.textContent=`匯出完成，共 ${all.length} 筆。`; }catch(e){el.textContent='匯出失敗：'+e.message;}}
initialize();
</script></body></html>
